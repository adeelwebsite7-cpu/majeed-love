:root{
  --surface:#1a060d;
  --surface-2:#2a0a17;
  --ink:#fff5f6;
  --muted:#f0b8c7;
  --line:#e7a0ad;
  --gold:#f3c46b;
  --pink:#ff5d8f;
  --maroon:#7b1230;
  --card:#30101d;
  --soft:#ffe9ee;
}

@media (prefers-color-scheme: dark){
  :root{
    --surface:#15050b;
    --surface-2:#240918;
    --ink:#fff7f8;
    --muted:#efb5c6;
    --line:#e78fa1;
    --gold:#f5c86f;
    --pink:#ff6394;
    --maroon:#811431;
    --card:#30101d;
    --soft:#ffe9ee;
  }
}

*{
  box-sizing:border-box
}

html{
  scroll-behavior:smooth
}

body{
  margin:0;
  background:var(--surface);
  color:var(--ink);
  font-family:"Noto Nastaliq Urdu","Manrope",serif;
  overflow-x:clip
}

button{
  font:inherit
}

.roman{
  font-family:"Manrope",sans-serif;
  letter-spacing:.02em
}

.nastaliq{
  font-family:"Noto Nastaliq Urdu",serif;
  line-height:2.15
}

.gold-text{
  background:linear-gradient(100deg,#fff0b4,#f3c46b 38%,#ff8caf 70%,#fff1c8);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent
}

.card{
  position:relative;
  background:linear-gradient(145deg,rgba(255,255,255,.10),rgba(255,93,143,.09) 40%,rgba(59,8,25,.92));
  border:1px solid rgba(243,196,107,.42);
  box-shadow:0 24px 70px rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.16);
  border-radius:34px;
  overflow:hidden
}

.card:before{
  content:"";
  position:absolute;
  inset:7px;
  border:1px solid rgba(255,255,255,.12);
  border-radius:27px;
  pointer-events:none
}

.glow{
  animation:glow 2.8s ease-in-out infinite
}

@keyframes glow{
  0%,100%{
    box-shadow:0 0 0 rgba(255,93,143,.05),0 24px 70px rgba(0,0,0,.42)
  }

  50%{
    box-shadow:0 0 38px rgba(255,93,143,.34),0 24px 70px rgba(0,0,0,.42)
  }
}

.float-heart{
  position:absolute;
  opacity:.55;
  animation:rise linear infinite;
  filter:drop-shadow(0 0 8px rgba(255,93,143,.7))
}

@keyframes rise{
  0%{
    transform:translateY(100vh) rotate(-10deg) scale(.7);
    opacity:0
  }

  8%{
    opacity:.65
  }

  92%{
    opacity:.5
  }

  100%{
    transform:translateY(-18vh) rotate(22deg) scale(1.15);
    opacity:0
  }
}

.pulse{
  animation:pulse 1.8s ease-in-out infinite
}

@keyframes pulse{
  0%,100%{
    transform:scale(1)
  }

  50%{
    transform:scale(1.10)
  }
}

.sway{
  animation:sway 3.4s ease-in-out infinite
}

@keyframes sway{
  0%,100%{
    transform:rotate(-3deg)
  }

  50%{
    transform:rotate(3deg)
  }
}

.drop{
  animation:drop .7s cubic-bezier(.2,.9,.3,1.4) both
}

@keyframes drop{
  from{
    transform:translateY(-22px) scale(.7);
    opacity:0
  }

  to{
    transform:none;
    opacity:1
  }
}

.fall{
  position:fixed;
  top:-40px;
  z-index:60;
  pointer-events:none;
  animation:fall linear forwards
}

@keyframes fall{
  to{
    transform:translateY(112vh) rotate(540deg);
    opacity:.1
  }
}

.shine{
  background:linear-gradient(90deg,#fff3c7,#f3c46b,#ff80a4,#fff3c7);
  background-size:220% auto;
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  animation:shine 4s linear infinite
}

@keyframes shine{
  to{
    background-position:220% center
  }
}

.envelope{
  transition:transform .35s ease,filter .35s ease
}

.envelope:hover{
  transform:translateY(-5px) rotate(-1deg);
  filter:brightness(1.1)
}

.wax{
  width:58px;
  height:58px;
  border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#ff8ca6,#a81636 62%,#651026);
  box-shadow:0 0 0 4px rgba(255,215,170,.18),0 8px 20px rgba(0,0,0,.35);
  display:grid;
  place-items:center;
  font-size:27px
}

@media(max-width:480px){
  .card{
    border-radius:28px
  }

  .nastaliq{
    line-height:2.05
  }
}

}

}

  }

  .sm\:py-12{

}
